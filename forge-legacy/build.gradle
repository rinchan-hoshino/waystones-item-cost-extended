plugins {
    id 'java-library'
    id 'net.minecraftforge.gradle' version '6.0.54'
    id 'org.spongepowered.mixin' version '0.7-SNAPSHOT'
}

rootProject.ext.configureWaystonesItemCost(project)
def p = rootProject.ext.profile

mixin {
    add sourceSets.main, 'waystones_item_cost_extended.refmap.json'
    config 'waystones_item_cost_extended.mixins.json'
    config 'waystones_item_cost_extended.client.mixins.json'
}

minecraft {
    mappings channel: 'official', version: p.minecraft
    reobf = true
    runs {
        server {
            workingDirectory file('runs/server')
            args '--nogui', '--mixin.config=waystones_item_cost_extended.mixins.json'
            mods {
                waystones_item_cost_extended {
                    source sourceSets.main
                }
            }
        }
    }
}

def profileDependenciesDir = rootProject.ext.ensureProfileDependencies(p)

repositories {
    flatDir {
        dirs profileDependenciesDir
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${p.minecraft}-${p.loader_version}"
    implementation fg.deobf("local:balm:${p.id}")
    implementation fg.deobf("local:waystones:${p.id}")
    if (p.containsKey('lightmanscurrency')) {
        compileOnly fg.deobf("local:lightmanscurrency:${p.id}")
    }
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

tasks.named('jar').configure { finalizedBy 'reobfJar' }
