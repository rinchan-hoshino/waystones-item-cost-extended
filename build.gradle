ext.profile = gradle.ext.waystonesItemCostProfile
ext.releaseVersion = new groovy.json.JsonSlurper().parse(file('support/profiles.json')).mod_version

ext.ensureProfileDependencies = { Map selected ->
    def dir = providers.gradleProperty('profileDependenciesDir')
        .map { file(it) }
        .orElse(rootProject.file('build/profile-dependencies'))
        .get()
    dir.mkdirs()
    def downloadWithSha512 = { String url, File target, String expectedSha512 ->
        def sha512 = { File f ->
            def md = java.security.MessageDigest.getInstance('SHA-512')
            f.withInputStream { is ->
                byte[] buf = new byte[8192]
                int read
                while ((read = is.read(buf)) != -1) {
                    md.update(buf, 0, read)
                }
            }
            md.digest().encodeHex().toString()
        }
        if (target.exists() && sha512(target) == expectedSha512) {
            return
        }
        new URL(url).withInputStream { input ->
            target.withOutputStream { output -> output << input }
        }
        if (sha512(target) != expectedSha512) {
            target.delete()
            throw new GradleException("SHA-512 mismatch for ${url}")
        }
    }
    def depNames = ['waystones', 'balm']
    if (selected.containsKey('lightmanscurrency')) {
        depNames << 'lightmanscurrency'
    }
    depNames.each { depName ->
        def dep = selected[depName]
        downloadWithSha512(dep.url as String, new File(dir, "${depName}-${selected.id}.jar"), dep.sha512 as String)
    }
    if (selected.generation == 'shogi') {
        def shogi = selected.shogi
        def platformJar = new File(dir, "shogi-${selected.id}.jar")
        downloadWithSha512(shogi.url as String, platformJar, shogi.sha512 as String)
        def apiJar = new File(dir, "shogi-api-${selected.id}.jar")
        if (!apiJar.exists()) {
            def zip = new java.util.zip.ZipFile(platformJar)
            try {
                def entry = zip.entries().find { !it.directory && it.name.startsWith('META-INF/') && it.name.contains('shogi-api-') && it.name.endsWith('.jar') }
                if (entry == null) {
                    throw new GradleException("Expected nested Shogi API JAR in ${platformJar}")
                }
                zip.getInputStream(entry).withStream { input ->
                    apiJar.withOutputStream { output -> output << input }
                }
            } finally {
                zip.close()
            }
        }
    }
    dir
}

allprojects {
    repositories {
        maven {
            url = 'https://libraries.minecraft.net'
            content {
                includeGroup 'org.lwjgl'
                includeGroup 'com.mojang'
            }
        }
        mavenCentral()
        maven { url = 'https://maven.fabricmc.net' }
        maven { url = 'https://maven.neoforged.net/releases' }
        maven { url = 'https://maven.minecraftforge.net' }
        exclusiveContent {
            forRepository { maven { url = 'https://api.modrinth.com/maven' } }
            filter { includeGroup 'maven.modrinth' }
        }
    }
}

ext.compatDirFor = { Map selected ->
    if (selected.id == '1.20.1-forge') return 'lightman-1.20.1'
    if (selected.id == '1.21.1-neoforge') return 'lightman-1.21.1'
    if (selected.id == '26.1.2-neoforge') return 'lightman-26.1'
    return 'none'
}

ext.adapterDirFor = { String mc ->
    if (mc == '1.20.1') return '1.20.1'
    if (mc == '1.21.1') return '1.21.1'
    return '26'
}

ext.commonMixinsFor = { String generation ->
    if (generation == 'legacy') return '"NetworkingMixin", "LegacyPhysicsDistanceMixin", "LegacyWaystoneMenuSyncMixin", "LegacyPhysicsWakeupMixin"'
    if (generation == 'requirement') return '"PaymentRequirementMixin", "ItemRequirementMixin", "ItemRequirementsContextMixin", "NetworkingMixin", "PhysicsRequirementDistanceMixin", "PhysicsDistanceComparatorMixin"'
    return '"ItemCostMixin", "NetworkingMixin", "PhysicsTeleportContextMixin", "PhysicsIsWithinDistanceMixin", "PhysicsDistanceComparatorMixin"'
}

ext.clientMixinsFor = { String generation ->
    if (generation == 'legacy') return '"LegacyWaystoneButtonMixin"'
    if (generation == 'requirement') return '"ItemRequirementTooltipMixin", "CombinedRequirementTooltipMixin", "PhysicsWaystoneButtonMixin"'
    return '"ShogiItemTooltipMixin", "PhysicsWaystoneButtonMixin"'
}

ext.configureWaystonesItemCost = { Project target ->
    target.layout.buildDirectory = rootProject.layout.buildDirectory.dir("profile-work/${profile.id}/${target.name}")
    target.group = 'dev.rinchan'
    target.version = "${releaseVersion}+${profile.minecraft}-${profile.loader}"

    target.base {
        archivesName = 'waystones-item-cost-extended'
    }
    target.java {
        toolchain.languageVersion = JavaLanguageVersion.of(Math.max(21, profile.java as int))
    }
    target.tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = profile.java as int
    }
    target.tasks.withType(AbstractArchiveTask).configureEach {
        preserveFileTimestamps = false
        reproducibleFileOrder = true
    }

    def adapterDir = adapterDirFor(profile.minecraft as String)
    def compatDir = compatDirFor(profile)

    target.sourceSets.main.java {
        srcDir rootProject.file('common/src/main/java')
        srcDir rootProject.file("compat/${compatDir}/src/main/java")
        srcDir rootProject.file("networking/${adapterDir}/src/main/java")
        srcDir rootProject.file("adapters/${adapterDir}/src/main/java")
        srcDir rootProject.file("versions/${profile.generation}/src/main/java")
        if (profile.loader == 'forge') {
            srcDir rootProject.file('loaders/forge-1.20.1/src/main/java')
        } else if (profile.loader == 'neoforge') {
            srcDir rootProject.file('loaders/neoforge/src/main/java')
        }
    }
    target.sourceSets.main.resources {
        srcDir rootProject.file('common/src/main/resources')
        srcDir target.layout.buildDirectory.dir('generated/profileResources')
    }

    def generateProfileResources = target.tasks.register('generateProfileResources') {
        def outputDir = target.layout.buildDirectory.dir('generated/profileResources')
        outputs.dir outputDir
        inputs.property 'profileId', profile.id
        inputs.file rootProject.file('support/profiles.json')
        inputs.files rootProject.fileTree('templates')
        doLast {
            def out = outputDir.get().asFile
            delete out
            out.mkdirs()
            def mixinValues = [
                java_version: profile.java,
                common_mixins: commonMixinsFor(profile.generation as String),
                client_mixins: clientMixinsFor(profile.generation as String)
            ]
            copy {
                from rootProject.file('templates/waystones_item_cost_extended.mixins.json')
                from rootProject.file('templates/waystones_item_cost_extended.client.mixins.json')
                into out
                expand(mixinValues)
            }
            if (profile.loader == 'fabric') {
                copy {
                    from rootProject.file('templates/fabric.mod.json')
                    into out
                    expand(profileValues(profile))
                }
            } else {
                def metadataName = profile.loader == 'neoforge' ? 'neoforge.mods.toml' : 'mods.toml'
                copy {
                    from rootProject.file("templates/${profile.loader}.mods.toml")
                    into new File(out, 'META-INF')
                    rename { metadataName }
                    expand(profileValues(profile))
                }
                if (profile.loader == 'forge') {
                    copy {
                        from rootProject.file('templates/forge.pack.mcmeta')
                        into out
                        rename { 'pack.mcmeta' }
                    }
                }
            }
        }
    }
    target.tasks.named('processResources').configure { dependsOn generateProfileResources }
    target.tasks.named('jar').configure {
        manifest.attributes(
            'Implementation-Title': 'Waystones Item Cost Extended',
            'Implementation-Version': target.version,
            'Implementation-Vendor': 'RinChan',
            'MixinConfigs': 'waystones_item_cost_extended.mixins.json,waystones_item_cost_extended.client.mixins.json'
        )
        archiveFileName = "waystones-item-cost-extended-${releaseVersion}+${profile.minecraft}-${profile.loader}.jar"
    }
}

ext.profileValues = { Map selected ->
    def waystonesBase = selected.waystones.version_number.split('\\+')[0]
    def balmBase = selected.balm.version_number.split('\\+')[0]
    def isForge = selected.loader == 'forge'
    [
        version: releaseVersion,
        minecraft_versions_json: groovy.json.JsonOutput.toJson(selected.game_versions),
        minecraft_range: minecraftRange(selected.game_versions as List<String>),
        java_version: selected.java,
        waystones_version: waystonesBase,
        balm_version: balmBase,
        shogi_dependency_json: selected.generation == 'shogi' ? ',\n    "shogi": ">=26.1"' : '',
        shogi_dependency_toml: selected.generation == 'shogi' ? """
[[dependencies.waystones_item_cost_extended]]
modId="shogi"
type="required"
versionRange="[26.1,)"
ordering="AFTER"
side="BOTH"
""" : '',
        loader_dependency_toml: selected.loader == 'neoforge' ? """
[[dependencies.waystones_item_cost_extended]]
modId="neoforge"
type="required"
versionRange="[${selected.loader_version},)"
ordering="NONE"
side="BOTH"
""" : '',
        lightman_dependency_toml: selected.containsKey('lightmanscurrency') ? """
[[dependencies.waystones_item_cost_extended]]
modId="lightmanscurrency"
${isForge ? 'mandatory=false' : 'type="optional"'}
versionRange="[${selected.lightmanscurrency.version_number},)"
ordering="AFTER"
side="BOTH"
""" : ''
    ]
}

ext.minecraftRange = { List<String> versions ->
    def parsed = versions.collect { it.tokenize('.').collect { part -> part as int } }
    parsed.sort { left, right ->
        def size = Math.max(left.size(), right.size())
        for (int index = 0; index < size; index++) {
            def leftPart = index < left.size() ? left[index] : 0
            def rightPart = index < right.size() ? right[index] : 0
            if (leftPart != rightPart) {
                return leftPart <=> rightPart
            }
        }
        return 0
    }
    def low = parsed.first()
    def high = new ArrayList<Integer>(parsed.last())
    high[high.size() - 1] = high.last() + 1
    "[${low.join('.')},${high.join('.')})"
}
