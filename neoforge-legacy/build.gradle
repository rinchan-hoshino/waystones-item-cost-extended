plugins {
    id 'java-library'
    id 'net.neoforged.gradle.userdev' version '7.0.124'
}

rootProject.ext.configurePaidWaystones(project)
def p = rootProject.ext.profile

def profileDependenciesDir = providers.gradleProperty('profileDependenciesDir').map { file(it) }.get()

if (p.minecraft == '1.20.4') {
    configurations.configureEach {
        resolutionStrategy.force 'org.apache.logging.log4j:log4j-api:2.11.2'
    }
}

dependencies {
    implementation "net.neoforged:neoforge:${p.loader_version}"
    implementation files(new File(profileDependenciesDir, "balm-${p.id}.jar"))
    implementation files(new File(profileDependenciesDir, "waystones-${p.id}.jar"))
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

runs {
    configureEach {
        modSource sourceSets.main
    }
    server {
        programArgument '--nogui'
    }
}
