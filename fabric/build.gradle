plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

def repositoryRoot = file('..')
def profileId = providers.gradleProperty("profileId").getOrElse("${minecraft_version}-fabric")
def profileDependenciesDir = providers.gradleProperty('profileDependenciesDir').orNull
def lockedDependency = { String name ->
    profileDependenciesDir == null ? null : file("${profileDependenciesDir}/${name}-${profileId}.jar")
}
def hasNoMojangMappings = minecraft_version in ['26.2', '26.3']
def dependencyConfiguration = hasNoMojangMappings ? 'implementation' : 'modImplementation'
def adapterDir = minecraft_version == '1.20.1' ? '1.20.1' : minecraft_version == '1.21.1' ? '1.21.1' : '26'
def commonMixins = source_generation == 'legacy'
    ? '"NetworkingMixin", "LegacyPhysicsDistanceMixin", "LegacyWaystoneMenuSyncMixin", "LegacyPhysicsWakeupMixin"'
    : source_generation == 'requirement'
        ? '"PaymentRequirementMixin", "ItemRequirementMixin", "ItemRequirementsContextMixin", "NetworkingMixin", "PhysicsRequirementDistanceMixin", "PhysicsDistanceComparatorMixin"'
        : '"ItemCostMixin", "NetworkingMixin", "PhysicsTeleportContextMixin", "PhysicsIsWithinDistanceMixin", "PhysicsDistanceComparatorMixin"'
def clientMixins = source_generation == 'legacy'
    ? '"LegacyWaystoneButtonMixin"'
    : source_generation == 'requirement'
        ? '"ItemRequirementTooltipMixin", "CombinedRequirementTooltipMixin", "PhysicsWaystoneButtonMixin"'
        : '"ShogiItemTooltipMixin", "PhysicsWaystoneButtonMixin"'

version = "${mod_version}+${minecraft_version}-fabric"
group = project.maven_group
base.archivesName = project.archives_base_name

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net' }
    maven { url = 'https://maven.twelveiterations.com/repository/maven-public/' }
    exclusiveContent {
        forRepository { maven { url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
}

loom {
    mods {
        waystones_item_cost_extended {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    if (hasNoMojangMappings) {
        mappings files('identity-mappings.jar')
    } else {
        mappings loom.officialMojangMappings()
    }
    add(dependencyConfiguration, "net.fabricmc:fabric-loader:${loader_version}")
    if (hasNoMojangMappings) {
        compileOnly "net.fabricmc:sponge-mixin:0.17.3+mixin.0.8.7"
    }
    add(dependencyConfiguration, "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}")
    if (profileDependenciesDir == null) {
        add(dependencyConfiguration, "maven.modrinth:balm:${balm_version}")
        add(dependencyConfiguration, "maven.modrinth:waystones:${waystones_version}")
    } else {
        add(dependencyConfiguration, files(lockedDependency('balm')))
        add(dependencyConfiguration, files(lockedDependency('waystones')))
    }
    if (source_generation == 'shogi') {
        if (profileDependenciesDir == null) {
            add(dependencyConfiguration, "maven.modrinth:shogi:${shogi_version}")
        } else {
            add(dependencyConfiguration, files(lockedDependency('shogi')))
        }
        compileOnly files(new File(repositoryRoot, "build/profile-dependencies/shogi-api-${profileId}.jar"))
    }
}

sourceSets.main.java {
    srcDir new File(repositoryRoot, 'common/src/main/java')
    srcDir new File(repositoryRoot, 'compat/none/src/main/java')
    srcDir new File(repositoryRoot, "networking/${adapterDir}/src/main/java")
    srcDir new File(repositoryRoot, "adapters/${adapterDir}/src/main/java")
    srcDir new File(repositoryRoot, "versions/${source_generation}/src/main/java")
    srcDir new File(repositoryRoot, 'loaders/fabric/src/main/java')
    srcDir new File(repositoryRoot, 'loaders/fabric-modmenu-stub/src/main/java')
}
sourceSets.main.resources {
    srcDir new File(repositoryRoot, 'common/src/main/resources')
    srcDir layout.buildDirectory.dir('generated/profileResources')
}

def generateProfileResources = tasks.register('generateProfileResources') {
    def outputDir = layout.buildDirectory.dir('generated/profileResources')
    outputs.dir outputDir
    inputs.property 'profileId', profileId
    inputs.property 'modVersion', mod_version
    inputs.files fileTree(new File(repositoryRoot, 'templates'))
    doLast {
        def out = outputDir.get().asFile
        delete out
        out.mkdirs()
        copy {
            from new File(repositoryRoot, 'templates/waystones_item_cost_extended.mixins.json')
            from new File(repositoryRoot, 'templates/waystones_item_cost_extended.client.mixins.json')
            into out
            expand(
                java_version: java_version,
                common_mixins: commonMixins,
                client_mixins: clientMixins
            )
        }
        copy {
            from new File(repositoryRoot, 'templates/fabric.mod.json')
            into out
            expand(
                version: mod_version,
                minecraft_versions_json: game_versions_json,
                java_version: java_version,
                waystones_version: waystones_version.split('\\+')[0],
                balm_version: balm_version.split('\\+')[0],
                shogi_dependency_json: source_generation == 'shogi' ? ',\n    "shogi": ">=26.1"' : ''
            )
        }
    }
}
processResources.dependsOn generateProfileResources

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = java_version as int
}
java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.toVersion(java_version)
    targetCompatibility = JavaVersion.toVersion(java_version)
    toolchain.languageVersion = JavaLanguageVersion.of(Math.max(21, java_version as int))
}
tasks.named('sourcesJar').configure {
    dependsOn generateProfileResources
    exclude 'com/terraformersmc/**'
}
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
tasks.named('jar').configure {
    exclude 'com/terraformersmc/**'
    manifest.attributes(
        'Implementation-Title': 'Waystones Item Cost Extended',
        'Implementation-Version': project.version,
        'Implementation-Vendor': 'RinChan',
        'MixinConfigs': 'waystones_item_cost_extended.mixins.json,waystones_item_cost_extended.client.mixins.json'
    )
    archiveFileName = "waystones-item-cost-extended-${mod_version}+${minecraft_version}-fabric.jar"
}
