name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-matrix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Temurin 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Temurin 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Temurin 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'support/profiles.json') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Run logic tests and full 8-target build matrix
        run: python3 scripts/build-matrix.py

      - name: Upload built JARs
        uses: actions/upload-artifact@v4
        with:
          name: waystones-item-cost-extended-jars
          path: build/release/*.jar
