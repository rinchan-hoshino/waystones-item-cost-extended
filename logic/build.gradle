plugins {
    id 'java-library'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
}

sourceSets.main.java {
    srcDir rootProject.file('common/src/main/java')
    srcDir rootProject.file('versions/requirement/src/main/java')
    srcDir rootProject.file('versions/shogi/src/main/java')
    include 'dev/rinchan/waystoneemeralds/payment/CraftingDenominations.java'
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}
