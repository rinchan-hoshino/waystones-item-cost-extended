plugins {
    id 'java-library'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
}

sourceSets.main.java {
    srcDir rootProject.file('common/src/main/java')
    include 'dev/rinchan/waystonesitemcost/payment/DenominatedPayment.java'
    include 'dev/rinchan/waystonesitemcost/payment/CraftingDenominations.java'
    include 'dev/rinchan/waystonesitemcost/payment/PaymentStatus.java'
    include 'dev/rinchan/waystonesitemcost/payment/ChangeSlotPlanner.java'
    include 'dev/rinchan/waystonesitemcost/config/SimpleToml.java'
    include 'dev/rinchan/waystonesitemcost/config/LegacyCostEntry.java'
    include 'dev/rinchan/waystonesitemcost/config/PaymentConfig.java'
    include 'dev/rinchan/waystonesitemcost/config/WaystonesRuleDetector.java'
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    systemProperty 'waystones.repo.root', rootProject.projectDir.absolutePath
    if (project.hasProperty('verifyJarsDir')) {
        systemProperty 'waystones.verify.jars.dir', project.property('verifyJarsDir').toString()
    }
}
