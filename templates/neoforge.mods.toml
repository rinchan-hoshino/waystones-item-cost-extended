modLoader="javafml"
loaderVersion="[1,)"
license="GPL-3.0-or-later"
issueTrackerURL="https://github.com/rinchan-hoshino/waystones-item-cost-extended/issues"

[[mods]]
modId="waystones_item_cost_extended"
version="${version}"
displayName="Waystones Item Cost Extended"
displayURL="https://modrinth.com/mod/waystones-item-cost-extended"
logoFile="icon.png"
authors="RinChan"
description='''
Extend Waystones with reversible multi-denomination payments, nested container deductions, combined item costs, payment tooltips, and optional Lightman's Currency support.
'''

[[mixins]]
