type="required"
versionRange="${minecraft_range}"
ordering="NONE"
side="BOTH"

[[dependencies.waystones_item_cost_extended]]
modId="waystones"
type="required"
versionRange="[${waystones_version},)"
ordering="AFTER"
side="BOTH"

[[dependencies.waystones_item_cost_extended]]
modId="balm"
type="required"
versionRange="[${balm_version},)"
ordering="AFTER"
side="BOTH"
${shogi_dependency_toml}${lightman_dependency_toml}
