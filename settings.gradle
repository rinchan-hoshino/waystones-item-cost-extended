import groovy.json.JsonSlurper

pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
        maven { url = 'https://maven.fabricmc.net' }
        maven { url = 'https://maven.neoforged.net/releases' }
        maven { url = 'https://maven.minecraftforge.net' }
        exclusiveContent {
            forRepository { maven { url = uri("${rootDir}/tools/locked-maven") } }
            filter {
                includeGroup 'org.spongepowered.mixin'
                includeGroup 'org.spongepowered'
            }
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'waystones-item-cost-extended'

def logicOnly = providers.gradleProperty('logicOnly').map { it.toBoolean() }.getOrElse(false)
def profileId = providers.gradleProperty('profile').getOrElse('1.21.1-neoforge')
def matrix = new JsonSlurper().parse(file('support/profiles.json'))
def profile = matrix.profiles.find { it.id == profileId }
if (profile == null) {
    throw new GradleException("Unknown Waystones Item Cost Extended profile: ${profileId}")
}
gradle.ext.waystonesItemCostProfile = profile
include('logic')

if (!logicOnly) {
    def module
    if (profile.loader == 'fabric') {
        module = 'fabric'
    } else if (profile.loader == 'forge') {
        module = 'forge-legacy'
    } else {
        module = 'neoforge-modern'
    }
    include(module)
}
