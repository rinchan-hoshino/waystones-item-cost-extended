allprojects {
    afterEvaluate { p ->
        if (p.plugins.hasPlugin('fabric-loom')) {
            def base = new File(System.getProperty('probe.sources'))
            def probe = p.sourceSets.create('runtimeProbe') {
                java.srcDirs new File(base, 'common/java'), new File(base, 'fabric/java'),
                        new File(System.getProperty('probe.checks')), new File(base, 'actions-' + System.getProperty('probe.actions', 'none')), new File(base, 'players-' + System.getProperty('probe.players') + '/java')
                resources.srcDir new File(base, 'fabric/resources')
                compileClasspath += p.sourceSets.main.output + p.sourceSets.main.compileClasspath
                runtimeClasspath += output + p.sourceSets.main.output + p.sourceSets.main.runtimeClasspath
            }
            p.loom.mods.create('itemcost_probe') { sourceSet(probe) }
            p.loom.runs.create('probeServer') {
                server()
                source(probe)
                runDir p.relativePath(new File(System.getProperty('probe.instance')))
            }
            p.tasks.named('runProbeServer').configure {
                doFirst { workingDir new File(System.getProperty('probe.instance')) }
            }
        }
    }
}
