plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.143'
}

rootProject.ext.configurePaidWaystones(project)
def p = rootProject.ext.profile
def rinlibDir = providers.gradleProperty('rinlibDir').map { file(it) }.get()
def rinlibJar = new File(rinlibDir, "rinlib-${rootProject.ext.rinlibVersion}+${p.minecraft}-${p.loader}.jar")
if (!rinlibJar.exists()) {
    throw new GradleException("Missing RinLib profile JAR: ${rinlibJar}")
}

neoForge {
    version = p.loader_version
    mods {
        waystone_emeralds {
            sourceSet sourceSets.main
        }
    }
    runs {
        server {
            server()
            programArgument '--nogui'
        }
        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
    }
}

def profileDependenciesDir = providers.gradleProperty('profileDependenciesDir').map { file(it) }.get()

repositories {
    flatDir { dirs rinlibDir }
}

dependencies {
    if (p.id == '1.21.1-neoforge') {
        compileOnly files(new File(profileDependenciesDir, "lightmanscurrency-${p.id}.jar"))
    }
    implementation files(new File(profileDependenciesDir, "balm-${p.id}.jar"))
    implementation files(new File(profileDependenciesDir, "waystones-${p.id}.jar"))
    if (p.generation == 'shogi') {
        implementation files(new File(profileDependenciesDir, "shogi-${p.id}.jar"))
        compileOnly files(rootProject.file("build/profile-dependencies/shogi-api-${p.id}.jar"))
    }
    def rinlibEmbedded = dependencies.create("dev.rinchan:rinlib-${p.loader}:${rootProject.ext.rinlibVersion}+${p.minecraft}") {
        artifact { name = rinlibJar.name - '.jar'; type = 'jar'; extension = 'jar' }
    }
    implementation rinlibEmbedded
    jarJar rinlibEmbedded
}
