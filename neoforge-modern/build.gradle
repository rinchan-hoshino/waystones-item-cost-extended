plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

rootProject.ext.configureWaystonesItemCost(project)
def p = rootProject.ext.profile

neoForge {
    version = p.loader_version
    mods {
        waystones_item_cost_extended {
            sourceSet sourceSets.main
        }
    }
    runs {
        server {
            server()
            programArgument '--nogui'
        }
        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
    }
}

def profileDependenciesDir = rootProject.ext.ensureProfileDependencies(p)

dependencies {
    if (p.containsKey('lightmanscurrency')) {
        compileOnly files(new File(profileDependenciesDir, "lightmanscurrency-${p.id}.jar"))
    }
    implementation files(new File(profileDependenciesDir, "balm-${p.id}.jar"))
    implementation files(new File(profileDependenciesDir, "waystones-${p.id}.jar"))
    if (p.generation == 'shogi') {
        implementation files(new File(profileDependenciesDir, "shogi-${p.id}.jar"))
        compileOnly files(new File(profileDependenciesDir, "shogi-api-${p.id}.jar"))
    }
}
